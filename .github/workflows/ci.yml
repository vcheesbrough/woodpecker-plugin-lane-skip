name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet -tags docker,e2e ./...
      - name: go test
        run: go test -race -v ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Context matcher against BuildKit
        run: go test -tags docker -v ./internal/key/
      - name: Build the image
        run: docker build -t lane-skip:ci .
      - name: Image smoke test
        env:
          PLUGIN_IMAGE: lane-skip:ci
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go test -tags e2e -v ./test/e2e/
